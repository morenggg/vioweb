<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Vioweb</title>
<meta name="description" content="Die Website von Vioweb wird gerade überarbeitet.">

<!-- Waehrend der Wartung soll diese duenne Seite nicht an die Stelle der
     echten Inhalte in den Suchergebnissen treten. Gecrawlt werden darf sie,
     sonst liest niemand das noindex. -->
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f7f7fa">

<link rel="icon" href="/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/img/favicon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">

<style>
/* =========================================================================
   Vioweb — Wartungsseite.

   Bewusst eine einzige Datei ohne Skript und ohne aeusseres Stylesheet:
   die Seite zeigt nur die Marke, und dafuer soll nichts nachgeladen werden.

   Aus dem Wertesatz der Website stehen hier nur die Werte, die diese Seite
   wirklich benutzt. Der vollstaendige Satz waere hier toter Code — die
   uebrigen Seiten fuehren ihn weiter.

   Warum heller Grund und nicht dunkel wie auf Instagram: Die Wortmarke ist
   dunkles #1A1C22 auf transparentem Grund. Auf dunklem Hintergrund
   verschwindet sie, und die Datei wird nicht veraendert. Solange es keine
   helle Variante gibt, bleibt der Grund hell.
   ========================================================================= */

@font-face {
  font-family: "Manrope";
  src: url("/fonts/manrope-latin.woff2") format("woff2");
  font-weight: 400 800;
  font-style: normal;
  font-display: swap;
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
    U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
    U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

:root {
  color-scheme: light;
  --grund:      #F7F7FA;
  --text-leise: #625F6B;
  --akzent:     #7C3AED;
  --schrift: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI",
             Roboto, "Helvetica Neue", Arial, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
  min-height: 100vh;
  min-height: 100dvh;   /* auf iOS ist 100vh die Hoehe OHNE Werkzeugleisten */
  display: grid;
  place-items: center;
  padding: max(2rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right))
           max(2rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
  background: var(--grund);
  font-family: var(--schrift);
  -webkit-font-smoothing: antialiased;
  /* Der Schein liegt hinter der Marke und faerbt den Grund nur an. Kein
     Verlauf ueber die ganze Flaeche, kein zweiter Farbton. */
  background-image:
    radial-gradient(60% 45% at 50% 46%, rgba(124, 58, 237, .14), transparent 70%);
  background-repeat: no-repeat;
}

.marke {
  display: grid;
  justify-items: center;
  gap: 1.9rem;
  text-align: center;
}

/* Gross, aber nie breiter als der Bildschirm. Im Hochformat einer
   Story-Kachel traegt die Marke etwa zwei Drittel der Breite, am
   Schreibtisch bleibt sie bei einer festen Obergrenze stehen. */
.marke img {
  display: block;
  width: min(68vw, 30rem);
  height: auto;
}

/* Nie breiter als die Marke darueber. Ohne die Begrenzung lief die Zeile
   auf dem Telefon ueber das Logo hinaus und kippte die Ordnung. Sie bricht
   dann lieber auf zwei Zeilen. */
.marke p {
  max-width: min(68vw, 30rem);
  font-size: clamp(.72rem, .66rem + .3vw, .82rem);
  font-weight: 600;
  line-height: 1.7;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--text-leise);
  text-wrap: balance;
}

/* Ein langsames Atmen des Scheins, sonst nichts. Bei reduzierter Bewegung
   entfaellt es ersatzlos; die Seite bleibt vollstaendig lesbar. */
@media (prefers-reduced-motion: no-preference) {
  body { animation: atmen 7s ease-in-out infinite; }
  @keyframes atmen {
    0%, 100% { background-size: 100% 100%; }
    50%      { background-size: 118% 118%; }
  }
}
</style>
</head>
<body>

<div class="marke">
  <img src="/img/wortmarke.png" alt="Vioweb" width="815" height="119" fetchpriority="high">
  <p>Die Website wird gerade überarbeitet</p>
</div>

</body>
</html>
